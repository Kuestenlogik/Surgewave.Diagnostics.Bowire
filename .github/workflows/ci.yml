name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Kuestenlogik.Surgewave.Diagnostics.Bowire.slnx

      - name: Build
        run: dotnet build Kuestenlogik.Surgewave.Diagnostics.Bowire.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution Kuestenlogik.Surgewave.Diagnostics.Bowire.slnx -c Release --no-build -v normal

      # Guards the packaging invariant the README describes: the host provides every
      # Kuestenlogik.Surgewave.* assembly, so the package must carry none of them
      # except the plugin itself. Not because the broker would fail to discover such
      # a plugin - its activation path loads into the default context and skips
      # assemblies already loaded, which I measured rather than assumed - but because
      # a package that carries them is larger than it needs to be and depends on load
      # order for its type identity instead of on there being only one copy.
      - name: Pack and verify package contents
        run: |
          dotnet publish src/Kuestenlogik.Surgewave.Diagnostics.Bowire/Kuestenlogik.Surgewave.Diagnostics.Bowire.csproj \
            -c Release --no-build -p:SurgewavePackPlugin=true

          # The package is the artefact the README tells operators to install, so
          # its absence has to fail the build rather than be noticed later.
          SPP=$(find artifacts/pluginPackage -name '*.swpkg' 2>/dev/null | head -1)
          if [ -z "$SPP" ]; then
            echo "::error::no .swpkg produced - SurgewavePackPlugin did not run"
            exit 1
          fi
          echo "packed: $SPP"

          # The checks read the .swpkg itself, not the publish directory: the pack
          # step removes that directory once it has zipped it, which is how this
          # step came to fail on a missing 'out' while the package was fine. And
          # the archive is what ships, so it is what has to be right.
          CONTENTS=$(unzip -Z1 "$SPP")
          echo "$CONTENTS"

          # The host provides every Kuestenlogik.Surgewave.* assembly, so the
          # package must carry none of them except the plugin itself. Not because
          # the broker would fail to discover such a plugin - its activation path
          # loads into the default context and skips assemblies already loaded,
          # which I measured rather than assumed - but because a package that
          # carries them is larger than it needs to be and depends on load order
          # for its type identity instead of on there being only one copy.
          STRAY=$(echo "$CONTENTS" | grep -E '(^|/)Kuestenlogik\.Surgewave\.[^/]*\.dll$' \
            | grep -v '^lib/Kuestenlogik\.Surgewave\.Diagnostics\.Bowire\.dll$' || true)
          if [ -n "$STRAY" ]; then
            echo "::error::host-provided assemblies leaked into the package:"
            echo "$STRAY"
            exit 1
          fi
          for required in lib/Kuestenlogik.Surgewave.Diagnostics.Bowire.dll \
                          deps/Kuestenlogik.Bowire.dll deps/Kuestenlogik.Bowire.Protocol.Surgewave.dll \
                          plugin.json; do
            echo "$CONTENTS" | grep -qx "$required" || { echo "::error::$required missing from the package"; exit 1; }
          done
          echo "package contents verified"

      - name: Upload .swpkg
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: artifacts/pluginPackage/*
