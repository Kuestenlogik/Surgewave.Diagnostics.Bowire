name: Release

# A tag v* builds, tests and packs the plugin and publishes the .swpkg as a
# GitHub release - the artefact the README tells operators to install. Same
# shape as the other Surgewave plugins (Functions, Ai, Connectors, ...), minus
# the NuGet push: this repo is a broker plugin, not a library anybody
# references.

on:
  push:
    tags: ['v*']

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Kuestenlogik.Surgewave.Diagnostics.Bowire.slnx

      - name: Build & Test
        run: |
          dotnet build Kuestenlogik.Surgewave.Diagnostics.Bowire.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet test --solution Kuestenlogik.Surgewave.Diagnostics.Bowire.slnx -c Release --no-build -v normal

      - name: Pack .swpkg
        run: |
          dotnet publish src/Kuestenlogik.Surgewave.Diagnostics.Bowire/Kuestenlogik.Surgewave.Diagnostics.Bowire.csproj \
            -c Release --no-build -p:SurgewavePackPlugin=true -p:Version=${{ steps.version.outputs.VERSION }}
          SPP=$(find artifacts/pluginPackage -name '*.swpkg' | head -1)
          [ -n "$SPP" ] || { echo "::error::no .swpkg produced"; exit 1; }
          # The file name carries the version; a mismatch means the tag did not
          # reach the pack step and the release would ship the wrong number.
          case "$SPP" in
            *"-${{ steps.version.outputs.VERSION }}.swpkg") echo "packed: $SPP" ;;
            *) echo "::error::$SPP does not carry version ${{ steps.version.outputs.VERSION }}"; exit 1 ;;
          esac

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            artifacts/pluginPackage/*.swpkg
            artifacts/pluginPackage/*.swpkg.sha256
